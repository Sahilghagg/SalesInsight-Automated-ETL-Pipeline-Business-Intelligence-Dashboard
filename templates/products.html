<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesInsight - Products</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h2> Sales<span>Insight</span></h2>
            </div>
            <div class="nav-menu">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/analytics" class="nav-link"> Analytics</a>
                <a href="/sales" class="nav-link"> Sales</a>
                <a href="/products" class="nav-link active"> Products</a>
                <a href="/customers" class="nav-link"> Customers</a>
            </div>
            <div class="user-menu">
                <div class="user-info" onclick="toggleDropdown()">
                    <span id="userName"> User</span>
                    <span class="dropdown-arrow">▼</span>
                </div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="/profile" class="dropdown-item"> My Profile</a>
                    <a href="/settings" class="dropdown-item"> Settings</a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" onclick="toggleTheme()"> Dark/Light Mode</div>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" onclick="logout()"> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1> Product Management</h1>
            <p>Manage your product catalog</p>
        </div>

        <div class="two-columns">
            <!-- Add Product Form -->
            <div class="form-card">
                <h3 class="form-title"> Add New Product</h3>
                <form id="productForm">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="category" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Books">Books</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Unit Price (₹) *</label>
                            <input type="number" id="unitPrice" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Stock Quantity</label>
                            <input type="number" id="stockQuantity" value="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Reorder Level</label>
                        <input type="number" id="reorderLevel" value="10">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"> Add Product</button>
                </form>
            </div>

            <!-- Product Stats -->
            <div class="form-card">
                <h3 class="form-title"> Product Statistics</h3>
                <div class="stats-mini">
                    <div class="stat-mini-item">
                        <span class="stat-mini-label">Total Products</span>
                        <span class="stat-mini-value" id="totalProducts">0</span>
                    </div>
                    <div class="stat-mini-item">
                        <span class="stat-mini-label">Low Stock Items</span>
                        <span class="stat-mini-value" id="lowStockCount">0</span>
                    </div>
                    <div class="stat-mini-item">
                        <span class="stat-mini-label">Total Value</span>
                        <span class="stat-mini-value" id="totalValue">₹0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Table -->
        <div class="table-container">
            <div class="table-header">
                <h3> Product Catalog</h3>
                <button class="btn btn-small" onclick="loadProducts()"> Refresh</button>
            </div>
            <div id="productsTable"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '/';
        }

        const user = JSON.parse(sessionStorage.getItem('user') || '{}');
        document.getElementById('userName').innerHTML = `👤 ${user.username || 'User'}`;

        function formatCurrency(amount) {
            return '₹' + amount.toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const data = await response.json();
                
                if (data.products && data.products.length > 0) {
                    let html = '<table><thead><tr>';
                    html += '<th>Code</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th>';
                    html += '</thead><tbody>';
                    
                    let totalValue = 0;
                    let lowStock = 0;
                    
                    data.products.forEach(product => {
                        const stockStatus = product.stock_quantity <= product.reorder_level ? 
                            '<span style="color: #ef4444;">⚠️ Low Stock</span>' : 
                            '<span style="color: #28a745;">✓ In Stock</span>';
                        
                        if (product.stock_quantity <= product.reorder_level) lowStock++;
                        totalValue += product.unit_price * product.stock_quantity;
                        
                        html += `<tr>
                            <td><strong>${product.product_code}</strong></td>
                            <td>${product.product_name}</td>
                            <td>${product.category}</td>
                            <td>${formatCurrency(product.unit_price)}</td>
                            <td>${product.stock_quantity}</td>
                            <td>${stockStatus}</td>
                            <td>
                                <button class="btn-edit" onclick="editProduct(${product.id})">✏️</button>
                                <button class="btn-delete" onclick="deleteProduct(${product.id})">🗑️</button>
                             </td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table>';
                    document.getElementById('productsTable').innerHTML = html;
                    document.getElementById('totalProducts').textContent = data.products.length;
                    document.getElementById('lowStockCount').textContent = lowStock;
                    document.getElementById('totalValue').textContent = formatCurrency(totalValue);
                } else {
                    document.getElementById('productsTable').innerHTML = '<p style="text-align: center; padding: 40px;">No products yet. Add your first product!</p>';
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        async function deleteProduct(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                const response = await fetch(`${API_URL}/api/products/${productId}`, { method: 'DELETE' });
                if (response.ok) {
                    loadProducts();
                    alert('Product deleted successfully!');
                }
            }
        }

        function editProduct(productId) {
            window.location.href = `/products/edit/${productId}`;
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productData = {
                product_name: document.getElementById('productName').value,
                category: document.getElementById('category').value,
                unit_price: parseFloat(document.getElementById('unitPrice').value),
                stock_quantity: parseInt(document.getElementById('stockQuantity').value),
                reorder_level: parseInt(document.getElementById('reorderLevel').value)
            };
            
            const response = await fetch(`${API_URL}/api/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });
            
            if (response.ok) {
                alert('Product added successfully!');
                document.getElementById('productForm').reset();
                loadProducts();
            } else {
                alert('Failed to add product');
            }
        });

        function toggleDropdown() {
            const userMenu = document.querySelector('.user-menu');
            userMenu.classList.toggle('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }

        document.addEventListener('click', function(event) {
            const userMenu = document.querySelector('.user-menu');
            if (userMenu && !userMenu.contains(event.target)) {
                userMenu.classList.remove('active');
            }
        });

        // Load saved theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        loadProducts();
    </script>
</body>
</html>
